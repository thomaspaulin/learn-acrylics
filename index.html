const FOCUS = {
  m11a: { d: "Lay colours in a fixed order you keep every time, so mixing becomes muscle memory.", c: "Can you find each colour without looking?", t: "Squeezing random blobs wherever there's space." },

const store = {
  async get(key) {
    try { if (typeof window !== "undefined" && window.storage && window.storage.get) return await window.storage.get(key); } catch {}
    try { const value = localStorage.getItem(key); return value == null ? null : { key, value }; } catch { return null; }
  },
  async set(key, value) {
    try { if (typeof window !== "undefined" && window.storage && window.storage.set) return await window.storage.set(key, value); } catch {}
    try { localStorage.setItem(key, value); return { key, value }; } catch { return null; }
  },
};

function streakOf(days) {
  const active = new Set(Object.keys(days).filter((k) => days[k] > 0));
  if (!active.size) return 0;
  let d = new Date(), cur = dstr(d), n = 0;
  if (!active.has(cur)) { d.setDate(d.getDate() - 1); cur = dstr(d); if (!active.has(cur)) return 0; }
  while (active.has(cur)) { n++; d.setDate(d.getDate() - 1); cur = dstr(d); }
  return n;
}

      <style>{"@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Yellowtail&display=swap'); .ax-script{font-family:'Yellowtail',cursive;} body{margin:0;}"}</style>
      <div className="max-w-3xl mx-auto px-5 py-10">

        <header className="mb-8" style={{ borderRadius: 22, overflow: "hidden", boxShadow: "0 8px 30px rgba(36,56,69,0.18)" }}>
          <div style={{ position: "relative", padding: "34px 28px 30px", background: "linear-gradient(165deg,#1f7e8c 0%, #2f9b94 28%, #f0b15a 72%, #e2672f 100%)" }}>
            <div style={{ position: "absolute", top: 22, right: 26, width: 86, height: 86, borderRadius: "50%", background: "radial-gradient(circle at 38% 38%, #ffe9b0, #f3c052 70%)", boxShadow: "0 0 50px rgba(246,200,90,0.75)" }} />
            <span className="inline-block rounded-full px-3 py-1 text-[11px] uppercase tracking-widest font-semibold" style={{ background: "rgba(253,246,232,0.22)", color: CREAM }}>Est. 2026 · Deliberate practice line</span>
            <h1 className="mt-3 font-extrabold uppercase" style={{ color: CREAM, fontSize: "2.7rem", lineHeight: 0.98, letterSpacing: "0.01em", textShadow: "0 2px 12px rgba(20,30,40,0.25)" }}>Acrylics</h1>
            <div className="ax-script" style={{ color: CREAM, fontSize: "2.2rem", lineHeight: 1, marginTop: 2, textShadow: "0 2px 12px rgba(20,30,40,0.25)" }}>to classical portraits</div>
            <p className="mt-3 text-sm" style={{ color: "rgba(253,246,232,0.92)", maxWidth: "44ch" }}>
              {STAGES.length} stages · {STAGES.reduce((a, s) => a + s.milestones.length, 0)} milestones · {ALL.length} sessions — beginner to a portrait of the people you love. Pencil work only ever as underdrawing. One a day or binge a stage; nothing is locked.
            </p>
          </div>
        </header>

        {!loaded && <p className="text-sm" style={{ color: INK2 }}>Loading…</p>}

        {loaded && <>

          <div className="mb-8 overflow-hidden" style={card}>
            <button onClick={() => setShowStart(!showStart)} className="w-full flex items-center justify-between p-4 text-left" style={{ background: "linear-gradient(90deg,#e2672f,#ec8a3c)", color: CREAM }}>
              <span className="text-sm uppercase tracking-widest font-semibold">Start here — launch plan</span>
              {showStart ? <ChevronDown size={20} /> : <ChevronRight size={20} />}
            </button>
            {showStart && (
              <div className="p-5 space-y-4 text-sm" style={{ color: INK }}>
                <div>
                  <div className="font-bold mb-1" style={{ color: ORANGE }}>Tonight — the urgent one</div>
                  <p className="leading-relaxed">Check your order is more than paint. To paint Monday you also need brushes, a surface (canvas paper or cheap boards), something to mix on, two water jars and a rag. If it's paint-only, add the missing bits now — the one thing that can sink day one. Then set your daily goal below.</p>
                </div>
                <div>
                  <div className="font-bold mb-1" style={{ color: TEAL }}>Sunday — clear the runway</div>
                  <ul className="space-y-1 leading-relaxed list-disc pl-5">
                    <li>Watch &amp; tick: the acrylic overview (Stage 1) and sphere theory + 5 elements of light (Stage 2).</li>
                    <li>Pencil only: the apple block-in and a few notan thumbnails with a marker. No paint — and they count.</li>
                    <li>Set up: prop a board near-vertical; DIY a stay-wet palette (sealed tub + damp towel + baking paper).</li>
                    <li>Find your phone's B&amp;W filter (greyscale test); put an object — egg, apple, mug — under one lamp.</li>
                  </ul>
                </div>
                <div>
                  <div className="font-bold mb-1" style={{ color: TEAL }}>Monday — paint lands, just go</div>
                  <ul className="space-y-1 leading-relaxed list-decimal pl-5">
                    <li>Lay out your palette (5 min).</li>
                    <li>Paint a 9-step value scale. It will be ugly; that's correct. Greyscale-test it.</li>
                    <li>Still keen? Flat coverage + one blend.</li>
                  </ul>
                  <p className="text-xs mt-1" style={{ color: INK2 }}>Then let Next-up carry you, 1–2 a day. Collapse this once rolling.</p>
                </div>
              </div>
            )}
          </div>

          <div className="mb-8 p-5" style={card}>
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div>
                <div className="text-xs uppercase tracking-widest" style={{ color: INK2 }}>Level {lvl + 1}</div>
                <div className="font-extrabold" style={{ color: ORANGE, fontSize: "1.9rem", lineHeight: 1.05 }}>{RANKS[lvl]}</div>
                <div className="text-xs mt-1" style={{ color: INK2 }}>{xp} XP · {doneCount === ALL.length ? "course complete" : toNext + " session" + (toNext > 1 ? "s" : "") + " to level up"}</div>
              </div>
              <div className="flex items-center gap-5">
                <div className="text-center">
                  <div className="font-extrabold flex items-center gap-1" style={{ color: streak ? ORANGE : INK2, fontSize: "1.7rem", lineHeight: 1 }}><Flame size={20} /> {streak}</div>
                  <div className="text-[10px] uppercase tracking-wide" style={{ color: INK2 }}>streak</div>
                </div>
                <div className="text-center">
                  <div className="font-extrabold" style={{ color: INK, fontSize: "1.7rem", lineHeight: 1 }}>{pct}%</div>
                  <div className="text-[10px] uppercase tracking-wide" style={{ color: INK2 }}>complete</div>
                </div>
                <div className="text-center">
                  <div className="font-extrabold" style={{ color: TEAL, fontSize: "1.7rem", lineHeight: 1 }}>{hwDone}</div>
                  <div className="text-[10px] uppercase tracking-wide" style={{ color: INK2 }}>pieces</div>
                </div>
              </div>
            </div>

            <div className="mt-4 rounded-full overflow-hidden" style={{ height: 10, background: "rgba(36,56,69,0.10)" }}>
              <div className="rounded-full" style={{ height: "100%", width: ((doneCount % 6) / 6) * 100 + "%", background: "linear-gradient(90deg,#e2672f,#e6a52c)", transition: "width .5s" }} />
            </div>

            <div className="mt-5 flex items-center justify-between flex-wrap gap-3" style={{ borderTop: "1px solid rgba(36,56,69,0.10)", paddingTop: 14 }}>
              <div className="flex items-center gap-2 text-sm">
                <Target size={16} style={{ color: TEAL }} />
                <span>Today: <b>{todayCount}</b>{target !== 99 && <> / {target}</>} {targetMet && <span style={{ color: ORANGE }}>✓ done</span>}</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="text-xs mr-1" style={{ color: INK2 }}>goal:</span>
                {[["1/day", 1], ["3/day", 3], ["Binge", 99]].map(([lab, t]) => (
                  <button key={t} onClick={() => pickTarget(t)} className="text-xs px-3 py-1 rounded-full font-semibold transition-colors" style={target === t ? { background: ORANGE, color: CREAM } : { background: "transparent", color: INK, border: "1px solid rgba(36,56,69,0.25)" }}>{lab}</button>
                ))}
              </div>
            </div>

            {nextId && (() => {
              const ms = STAGES.flatMap((s) => s.milestones).find((m) => m.sessions.some((x) => x.id === nextId));
              const ss = ms.sessions.find((x) => x.id === nextId);
              return (
                <div className="mt-4 flex items-stretch rounded-xl overflow-hidden" style={{ background: "linear-gradient(90deg,#1f8389,#2a9a94)" }}>
                  <div className="flex-1 p-3" style={{ color: CREAM }}>
                    <div className="text-[10px] uppercase tracking-widest mb-0.5" style={{ color: "#ffe1b0" }}>Next up</div>
                    <div className="text-sm">{ss.do}</div>
                  </div>
                  <button onClick={() => jump(ms.id)} className="px-4 font-bold rounded-l-xl" style={{ background: GOLD, color: "#3a2a12" }}>Go →</button>
                </div>
              );
            })()}

            <div className="mt-5 flex flex-wrap gap-1.5">
              {STAGES.map((s, i) => {
                const ids = s.milestones.flatMap((m) => m.sessions.map((x) => x.id));
                const complete = ids.every((id) => done[id]);
                return (
                  <span key={s.id} title={s.name} className="inline-flex items-center justify-center text-xs font-bold rounded-full" style={{ width: 28, height: 28, background: complete ? ORANGE : "transparent", color: complete ? CREAM : INK2, border: complete ? "none" : "1px solid rgba(36,56,69,0.22)" }}>{i + 1}</span>
                );
              })}
            </div>
          </div>

          <div className="mb-8 p-5" style={card}>
            <div className="mb-3"><span className="inline-block rounded-full px-3 py-1 text-xs uppercase tracking-widest font-semibold" style={pill(TEAL)}>House rules — make it deliberate</span></div>
            <p className="text-sm leading-relaxed mb-3">Every session is <b>decide → do → check</b>. Painting until it "looks okay" is the accidental trap; setting a target and testing against it is the practice.</p>
            <ul className="text-sm space-y-1.5">
              <li><b style={{ color: ORANGE }}>Value test:</b> photograph painting + reference, desaturate both, compare. Your teacher-in-the-room.</li>
              <li><b style={{ color: ORANGE }}>Drawing test:</b> mirror-flip to expose errors; measure angles, don't eyeball.</li>
              <li><b style={{ color: ORANGE }}>Set-up:</b> paint on a near-vertical surface; step back often.</li>
              <li><b style={{ color: ORANGE }}>One decision per painting:</b> pick handling (loose vs controlled) + chroma hierarchy before you start, and hold it.</li>
              <li><b style={{ color: ORANGE }}>Chroma is a tool:</b> crank it at focal points; mute elsewhere with a complement, never black.</li>
              <li><b style={{ color: ORANGE }}>Homework:</b> 3+ quick pieces per session. Optional but rewarded — small, fast, good-enough, move on.</li>
            </ul>
          </div>

          <div className="mb-8 p-5" style={card}>
            <div className="mb-3"><span className="inline-block rounded-full px-3 py-1 text-xs uppercase tracking-widest font-semibold" style={pill(TERRA)}>What to avoid in lessons</span></div>
            <ul className="text-sm space-y-2">
              <li><b style={{ color: TERRA }}>Perfectionism:</b> once the Check passes, STOP — even with visible flaws. Save polish for hobby pieces + capstone portraits.</li>
              <li><b style={{ color: TERRA }}>Reworking over redoing:</b> five fresh attempts beat one painting fixed twenty times.</li>
              <li><b style={{ color: TERRA }}>Detail before structure:</b> no rendering until value + proportion masses are right.</li>
              <li><b style={{ color: TERRA }}>Going small and fiddly:</b> bigger brush + surface than feels comfortable forces mass decisions.</li>
              <li><b style={{ color: TERRA }}>Passive watching:</b> never finish a video without painting from it.</li>
              <li><b style={{ color: TERRA }}>Comparison spiral:</b> measure against your own last painting, not strangers online.</li>
              <li><b style={{ color: TERRA }}>Precious-surface freeze:</b> cheap supports, paint over failures.</li>
              <li><b style={{ color: TERRA }}>Comfort-zone reps:</b> aim at what you're bad at, not what feels good.</li>
            </ul>
          </div>

          <div className="mb-8 overflow-hidden" style={card}>
            <button onClick={() => setShowRef(!showRef)} className="w-full flex items-center justify-between p-4 text-left">
              <span className="inline-block rounded-full px-3 py-1 text-xs uppercase tracking-widest font-semibold" style={pill(TEAL)}>Toolkit &amp; reference</span>
              {showRef ? <ChevronDown size={20} style={{ color: TEAL }} /> : <ChevronRight size={20} style={{ color: TEAL }} />}
            </button>
            {showRef && (
              <div className="px-5 pb-5 space-y-5 text-sm">
                <div>
                  <div className="font-bold mb-1.5" style={{ color: ORANGE }}>Starter kit</div>
                  <ul className="space-y-1 list-disc pl-5">
                    <li><b>Starter palette:</b> Titanium White, Ultramarine Blue, a warm red (Cadmium/Naphthol), a warm yellow (Cadmium/Hansa), Burnt Sienna.</li>
                    <li><b>Portrait (Zorn) palette, Stage 9+:</b> Ivory Black, Titanium White, Yellow Ochre, Cadmium Red.</li>
                    <li><b>Fight fast drying:</b> a stay-wet palette + Golden OPEN or a retarder medium.</li>
                    <li><b>Brushes:</b> small + medium flat, one round, one filbert — a size bigger than feels comfortable.</li>
                    <li><b>Surfaces:</b> cheap primed boards / canvas paper, lots. Paint over failures.</li>
                    <li><b>Also:</b> palette knife, two water jars, a rag, phone for greyscale checks.</li>
                  </ul>
                </div>
                <div>
                  <div className="font-bold mb-1.5" style={{ color: ORANGE }}>Where to find reference</div>
                  <ul className="space-y-1 list-disc pl-5">
                    <li><b>Free photos:</b> <a className="underline" target="_blank" rel="noopener noreferrer" href="https://unsplash.com" style={{ color: TEAL }}>Unsplash</a>, <a className="underline" target="_blank" rel="noopener noreferrer" href="https://www.pexels.com" style={{ color: TEAL }}>Pexels</a>.</li>
                    <li><b>Master copies (public domain):</b> <a className="underline" target="_blank" rel="noopener noreferrer" href="https://www.metmuseum.org/art/collection" style={{ color: TEAL }}>Met</a>, <a className="underline" target="_blank" rel="noopener noreferrer" href="https://www.artic.edu/collection" style={{ color: TEAL }}>Art Institute</a>, <a className="underline" target="_blank" rel="noopener noreferrer" href="https://www.rijksmuseum.nl/en/rijksstudio" style={{ color: TEAL }}>Rijksmuseum</a>.</li>
                    <li><b>Posters &amp; landscapes:</b> your own Pinterest board.</li>
                    <li><b>Portraits:</b> shoot your own — ONE directional light, neutral background, high res.</li>
                  </ul>
                </div>
                <div>
                  <div className="font-bold mb-1.5" style={{ color: ORANGE }}>Diagnostic — why does it look off?</div>
                  <ul className="space-y-1 list-disc pl-5">
                    <li><b>Flat / lifeless</b> → value range too narrow.</li>
                    <li><b>Muddy</b> → too many mixes / chroma everywhere. Mute with a complement, not black.</li>
                    <li><b>Amateur / cut-out</b> → every edge equally hard.</li>
                    <li><b>Doesn't look like them</b> → proportion, not features.</li>
                    <li><b>Colours don't sit together</b> → judge each against its neighbour.</li>
                    <li><b>Too loud / no focus</b> → no chroma hierarchy.</li>
                    <li><b>Forms look pasted-on</b> → light logic ignored; check the 5 zones.</li>
                  </ul>
                </div>
              </div>
            )}
          </div>

          {STAGES.map((stage, si) => {
            const ids = stage.milestones.flatMap((m) => m.sessions.map((x) => x.id));
            const dc = ids.filter((id) => done[id]).length;
            return (
              <section key={stage.id} className="mb-9">
                <div className="flex items-center gap-3 mb-2">
                  <div className="flex items-center justify-center font-extrabold rounded-full shrink-0" style={{ width: 46, height: 46, background: "linear-gradient(150deg,#e6a52c,#e2672f)", color: CREAM, fontSize: "1.3rem", boxShadow: "0 3px 10px rgba(226,103,47,0.35)" }}>{si + 1}</div>
                  <div className="flex-1">
                    <div className="text-[10px] uppercase tracking-widest" style={{ color: INK2 }}>Stage {si + 1}</div>
                    <h2 className="font-bold leading-tight" style={{ color: INK, fontSize: "1.2rem" }}>{stage.name}</h2>
                  </div>
                  <span className="text-xs" style={{ color: INK2 }}>{dc}/{ids.length}</span>
                </div>
                <p className="text-sm mb-4 leading-relaxed" style={{ color: INK2 }}>{stage.blurb}</p>

                <div className="space-y-3">
                  {stage.milestones.map((m) => {
                    const mids = m.sessions.map((x) => x.id);
                    const md = mids.filter((id) => done[id]).length;
                    const all = md === mids.length;
                    const isOpen = open[m.id] ?? mids.includes(nextId);
                    return (
                      <div id={m.id} key={m.id} className="overflow-hidden" style={card}>
                        <button onClick={() => setOpen({ ...open, [m.id]: !isOpen })} className="w-full text-left flex items-center gap-3 p-4">
                          <span className="shrink-0 flex items-center justify-center text-[10px] font-bold rounded-full" style={{ width: 28, height: 28, background: all ? TEAL : "transparent", color: all ? CREAM : INK2, border: all ? "none" : "1px solid rgba(36,56,69,0.25)" }}>{all ? <Check size={15} strokeWidth={3} /> : md + "/" + mids.length}</span>
                          <span className="flex-1 font-semibold" style={{ color: INK, fontSize: "1.02rem", opacity: all ? 0.5 : 1 }}>{m.title}</span>
                          {isOpen ? <ChevronDown size={18} style={{ color: INK2 }} /> : <ChevronRight size={18} style={{ color: INK2 }} />}
                        </button>

                        {isOpen && (
                          <div className="px-4 pb-4">
                            <p className="text-xs italic mb-3 ml-1" style={{ color: INK2 }}>Goal: {m.goal}</p>
                            <div className="space-y-2">
                              {m.sessions.map((s, si2) => {
                                const isDone = !!done[s.id], isNext = s.id === nextId;
                                return (
                                  <div key={s.id} className="flex items-start gap-3 p-3 rounded-xl" style={{ background: isNext ? "#fbe7d3" : PAGE, border: isNext ? "1px solid " + ORANGE : "1px solid rgba(36,56,69,0.08)" }}>
                                    <button onClick={() => toggle(s.id)} className="mt-0.5 shrink-0 active:scale-90 transition-transform" aria-label="toggle">
                                      <span className="flex items-center justify-center rounded-full" style={{ width: 20, height: 20, background: isDone ? ORANGE : "transparent", color: CREAM, border: isDone ? "none" : "2px solid rgba(36,56,69,0.28)" }}>{isDone && <Check size={12} strokeWidth={3} />}</span>
                                    </button>
                                    <div className="flex-1 min-w-0">
                                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                                        <span className="text-[11px] font-bold uppercase tracking-wide" style={{ color: ORANGE }}>Session {si2 + 1}</span>
                                        {isNext && <span className="text-[10px] font-semibold uppercase tracking-wide" style={{ color: INK2 }}>← next</span>}
                                        <span className="text-[10px] font-semibold uppercase" style={{ color: INK2 }}>+10 XP</span>
                                        {s.tag === "underdrawing" && <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{ background: "rgba(31,131,137,0.14)", color: TEAL }}>✎ feeds the painting</span>}
                                      </div>
                                      <p className="text-sm leading-relaxed" style={{ color: INK, textDecoration: isDone ? "line-through" : "none", opacity: isDone ? 0.5 : 1 }}>{s.do}</p>
                                      {FOCUS[s.id] && (
                                        <div className="mt-1.5 text-xs leading-relaxed p-2.5 rounded-lg" style={{ background: "rgba(230,165,44,0.10)", border: "1px solid rgba(230,165,44,0.30)" }}>
                                          <div><b style={{ color: ORANGE }}>Decide:</b> <span style={{ color: INK }}>{FOCUS[s.id].d}</span></div>
                                          <div className="mt-0.5"><b style={{ color: TEAL }}>Check:</b> <span style={{ color: INK }}>{FOCUS[s.id].c}</span></div>
                                          {FOCUS[s.id].t && <div className="mt-0.5"><b style={{ color: TERRA }}>Avoid:</b> <span style={{ color: INK }}>{FOCUS[s.id].t}</span></div>}
                                        </div>
                                      )}
                                      <div className="mt-1.5 flex flex-col gap-1">
                                        {[s.watch, ...(s.more || []), ...(s.alt ? [s.alt] : [])].map((r, ri) => {
                                          const isAlt = s.alt && r === s.alt;
                                          const paid = r.cost === "paid";
                                          return (
                                            <div key={ri} className="flex items-center gap-2 flex-wrap">
                                              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide" style={paid ? { background: ORANGE, color: CREAM } : { background: "rgba(31,131,137,0.14)", color: TEAL }}>{paid ? "Paid" + (isAlt ? " Alt" : "") : "Free"}</span>
                                              <a href={r.url} target="_blank" rel="noopener noreferrer" className="text-xs underline inline-flex items-center gap-1" style={{ color: TEAL }}><Play size={11} /> {r.label}</a>
                                            </div>
                                          );
                                        })}
                                      </div>
                                      {HW[s.id] && (
                                        <div className="mt-2 pl-2.5" style={{ borderLeft: "3px solid " + GOLD }}>
                                          <div className="text-[10px] uppercase tracking-widest font-bold mb-1" style={{ color: INK2 }}>Homework — solidify it (+10 XP each)</div>
                                          <div className="space-y-1">
                                            {HW[s.id].map((hwText, hi) => {
                                              const hid = s.id + "h" + hi; const hd = !!done[hid];
                                              return (
                                                <button key={hid} onClick={() => toggle(hid)} className="w-full text-left flex items-start gap-2">
                                                  <span className="mt-0.5 shrink-0 flex items-center justify-center rounded" style={{ width: 16, height: 16, background: hd ? GOLD : "transparent", color: "#3a2a12", border: hd ? "none" : "2px solid rgba(36,56,69,0.28)" }}>{hd && <Check size={10} strokeWidth={3} />}</span>
                                                  <span className="text-xs leading-snug" style={{ color: INK, textDecoration: hd ? "line-through" : "none", opacity: hd ? 0.5 : 1 }}>{hwText}</span>
                                                </button>
                                              );
                                            })}
                                          </div>
                                        </div>
                                      )}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                            <div className="mt-3 ml-1">
                              <textarea value={notes[m.id] || ""} onChange={(e) => setNote(m.id, e.target.value)} rows={2} placeholder="Notes: what worked, what to fix next time…" className="w-full p-2 text-sm rounded-lg resize-y focus:outline-none" style={{ background: PAGE, border: "1px solid rgba(36,56,69,0.20)", color: INK, fontFamily: "'Poppins', sans-serif" }} />
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>
            );
          })}

          <footer className="text-xs text-center pt-4 leading-relaxed" style={{ borderTop: "1px solid rgba(36,56,69,0.12)", color: INK2 }}>
            Every session has a free resource; Paid Alt links are optional upgrades. If a deep link 404s, search its title on the same site. Progress saves automatically.
          </footer>
        </>}
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
